<div class="fd-w-100">
  <div class="fd-flex fd-justify-between fd-items-center fd-mb-4 fd-divider">
    <h2 class="fd-m-0 fd-text-white fd-fw-bold">My Friends</h2>
    <button type="button" class="fd-btn fd-btn-primary" (click)="navigateToAddFriend()">
      <i class="bi bi-person-plus"></i> Add Friend
    </button>
  </div>

  <div>
    <div *ngIf="friends$ | async as friends; else loadingFriends">
      <div *ngIf="friends.length === 0; else friendsGrid" class="fd-text-center fd-py-5">
        <div>
          <i class="bi bi-people fd-display-1 fd-text-white fd-mb-4"></i>
          <h3 class="fd-text-white fd-mb-2 fd-fw-bold">No friends yet</h3>
          <p class="fd-text-white fd-mb-4">Start by adding some friends to play darts together!</p>
          <button type="button" class="fd-btn fd-btn-primary" (click)="navigateToAddFriend()">
            Add Your First Friend
          </button>
        </div>
      </div>

      <ng-template #friendsGrid>
        <div class="fd-friends-grid">
          <div *ngFor="let friend of friends" class="fd-friends-grid__cell">
            <div class="fd-card-row transition-all">
              <div class="fd-position-relative fd-me-3">
                @if (friend.Picture) {
                  <img src="{{ friend.Picture }}" alt="" class="fd-rounded-circle fd-friend-avatar" />
                } @else {
                  <i class="bi bi-person-circle fd-text-white fd-friend-avatar-icon"></i>
                }
                <div
                  class="fd-status-dot"
                  [class.fd-status-dot--online]="friend.IsOnline"
                  [class.fd-status-dot--offline]="!friend.IsOnline"
                ></div>
              </div>
              <div class="fd-flex-1">
                <h4 class="fd-m-0 fd-mb-1 fd-text-white fd-fw-bold">{{ friend.UserName }}</h4>
                <p class="fd-m-0 fd-mb-1 fd-text-white fd-small">{{ friend.Country }}</p>
                <p class="fd-m-0 fd-text-white" style="font-size: 0.8rem">
                  Friends since {{ friend.FriendsSince | date: 'shortDate' }}
                </p>
              </div>
              <div class="fd-flex fd-flex-col fd-gap-2">
                @if (friend.OpenGameId) {
                  <button type="button" class="fd-btn fd-btn-primary fd-btn-sm" (click)="joinGame(friend)">
                    <i class="bi bi-controller"></i> Join game
                  </button>
                }
                <button type="button" class="fd-btn fd-btn-ghost fd-btn-sm" (click)="removeFriend(friend)">
                  <i class="bi bi-person-x"></i> Remove
                </button>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </div>

    <ng-template #loadingFriends>
      <div class="fd-text-center fd-py-5">
        <div class="fd-spinner" role="status">
          <span class="fd-sr-only">Loading...</span>
        </div>
        <p class="fd-mt-3 fd-text-white">Loading friends...</p>
      </div>
    </ng-template>
  </div>
</div>
