<div
  *ngIf="haveWinner(winnerName)"
  id="winnerPopupOverlay"
  class="fd-winner-overlay fd-flex fd-w-100 fd-items-center fd-justify-center fd-p-3"
>
  <div class="winner-popup">
    <div class="fd-winner-close-wrap">
      <button type="button" (click)="close()" class="fd-btn fd-btn-primary fd-winner-close">
        <i class="bi bi-x"></i>
      </button>
    </div>
    <div class="emoji">🎉</div>
    <div class="winner-name">{{ winnerName }}</div>
    <div class="winner-text">{{ winnerText }}</div>
  </div>
</div>
